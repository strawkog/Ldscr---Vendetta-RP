<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendetta RP - Back to 90’s</title>
  <link rel="stylesheet" href="styles/style.css?v=20261017-background">
  <script src="scripts/loading.js" defer></script>
</head>
<body>
  <svg class="text-filters" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="text-inner-shadow" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
        <feComponentTransfer in="SourceAlpha" result="outside">
          <feFuncA type="table" tableValues="1 0" />
        </feComponentTransfer>
        <feGaussianBlur in="outside" stdDeviation="2" result="blur" />
        <feComposite in="blur" in2="SourceAlpha" operator="in" result="inner-edge" />
        <feFlood flood-color="#000000" flood-opacity="0.5" result="shadow-color" />
        <feComposite in="shadow-color" in2="inner-edge" operator="in" result="shadow" />
        <feComposite in="shadow" in2="SourceGraphic" operator="over" />
      </filter>
    </defs>
  </svg>
  <div class="background" aria-hidden="true"></div>
  <main class="screen" aria-label="Vendetta RP loading screen">
    <header class="brand">
      <h1 class="title">Vendetta RP</h1>
      <p class="subtitle">Back To 90’s</p>
    </header>
    <section class="loading" aria-label="Loading status">
      <p class="loading-text" id="loading-status" role="status" aria-live="polite">Connexion au serveur…</p>
      <div class="progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
        <div class="bar-art">
          <img class="loadingbar-bg" src="images/loadingbar-bg.svg" alt="" width="1720" height="32">
          <div class="bar-fill">
            <img class="loadingbar" src="images/loadingbar.svg" alt="" width="1720" height="32">
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
